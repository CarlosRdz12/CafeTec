name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activar pnpm
        run: corepack enable
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Verificar tipos
        run: pnpm typecheck
      - name: Pruebas
        run: pnpm test
      - name: Compilar
        run: pnpm build
